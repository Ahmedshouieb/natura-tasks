<style>
  /* ===== BRAND TOKENS — edit here to fine-tune Natura colours ===== */
  :root {
    --nat-900: #143820; --nat-700: #1F5130; --nat-500: #2F7A45; --nat-leaf: #7AB648;
    --nat-harvest: #E9A23B; --nat-cream: #F6F4EC; --nat-ink: #1C2421;
    --sla-green: #2F9E5B; --sla-yellow: #E0A21B; --sla-red: #D64545;
  }
  html, body { background: var(--nat-cream); color: var(--nat-ink); }
  body { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; -webkit-tap-highlight-color: transparent; }
  h1, h2, h3, .font-display { font-family: 'Montserrat', system-ui, sans-serif; }
  .hero-bg {
    background:
      radial-gradient(circle at 15% 20%, rgba(122,182,72,.35), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(233,162,59,.25), transparent 40%),
      linear-gradient(135deg, var(--nat-900), var(--nat-700) 60%, var(--nat-500));
  }
  /* SLA visual system driven by data-sla attribute (updated live) */
  .task-card { border-left: 6px solid var(--sla-green); transition: box-shadow .2s, transform .2s; }
  .task-card:hover { box-shadow: 0 10px 25px -10px rgba(20,56,32,.25); }
  .task-card[data-sla="yellow"] { border-left-color: var(--sla-yellow); }
  .task-card[data-sla="red"] { border-left-color: var(--sla-red); animation: redPulse 1.6s ease-in-out infinite; }
  .task-card[data-sla="done"] { border-left-color: #B9C2BC; opacity: .88; }
  @keyframes redPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(214,69,69,.0); } 50% { box-shadow: 0 0 0 4px rgba(214,69,69,.28); } }
  .sla-pill[data-sla="green"] { background:#E3F4EA; color:#1E7A45; }
  .sla-pill[data-sla="yellow"] { background:#FCF1D6; color:#8A5D00; }
  .sla-pill[data-sla="red"] { background:#FBE1E1; color:#A82828; animation: blink 1s steps(2,start) infinite; }
  .sla-pill[data-sla="done"] { background:#EEF0EE; color:#56625B; }
  @keyframes blink { to { visibility: visible; } 50% { opacity: .55; } }
  .tab-active { background: var(--nat-700); color: #fff; }
  .scroll-thin::-webkit-scrollbar { height: 6px; width: 6px; } .scroll-thin::-webkit-scrollbar-thumb { background:#cfd6cf; border-radius: 6px; }

  .fade-in { animation: fade .25s ease; } @keyframes fade { from { opacity:0; transform: translateY(4px);} to {opacity:1; transform:none;} }

  .mention { background:#E3F4EA; color:#1F5130; font-weight:600; border-radius:6px; padding:0 .3em; white-space:nowrap; }
  .mention-menu { box-shadow: 0 18px 40px -12px rgba(20,56,32,.35), 0 0 0 1px rgba(20,56,32,.08); }

  .pop-in { animation: popIn .14s ease-out; } @keyframes popIn { from { opacity:0; transform: translateY(-4px) scale(.98);} to { opacity:1; transform:none; } }

<script>
/* =====================================================================

/* =====================================================================

   ===================================================================== */

   ⚠ Emails are a firstname@natura-eg.com guess — correct them in Team → Edit or in the Sheet. */
const SEED_VERSION = 2;  // bump to reload this list in browsers that already ran the demo
const SEED_USERS = [
  { name: 'Ingy', username: 'Ingy', password: 'sha256:6e4244e3030a9770416194b9f9c185d58280fb174f9c096a258ee74c47efc36c', email: 'ingy@natura-eg.com', role: 'admin', aliases: 'Ingy, Engy, Injy, إنجي', active: true },
  { name: 'Ahmed Shouieb', username: 'Shouieb', password: 'sha256:f945b474651e0692fc7fde1a6356e777e0c164e11673335235c3872058c71bf2', email: 'shouieb@natura-eg.com', role: 'admin', aliases: 'Ahmed, Shouieb, Shouib, أحمد', active: true },
  { name: 'Hamed', username: 'Hamed', password: 'sha256:07a6c47bed3b88aaf3c29933abfac377d487661494caf082a35f86d46232f397', email: 'hamed@natura-eg.com', role: 'admin', aliases: 'Hamed, حامد', active: true },
  { name: 'Ali', username: 'Ali', password: 'sha256:dbd0b5699c99a8a9d244d22a61c537ccf3521ed9f77feeeb84335256f5d807bb', email: 'ali@natura-eg.com', role: 'employee', aliases: 'Ali, Aly, علي', active: true },
  { name: 'Mohamed Ali', username: 'Mohamed ali', password: 'sha256:17dd58aa247486788375d0b07f2b0369815bf84f67cd3b504183e773e67b9d19', email: 'mohamed.ali@natura-eg.com', role: 'employee', aliases: 'Mohamed, Mohammed, Mohamad, محمد', active: true },
  { name: 'Shallaby', username: 'Shallaby', password: 'sha256:ef1aa8cb311075c952243da394e92131d7424c03e1f341b6f7d2f4fb46fc0850', email: 'shallaby@natura-eg.com', role: 'employee', aliases: 'Shallaby, Shalaby, Shalabi, شلبي', active: true },
  { name: 'Youssef', username: 'Youssef', password: 'sha256:cd3c720e4a42d1560b62091d5984f09468728e5d8c3e694bd08a493e7b5ab323', email: 'youssef@natura-eg.com', role: 'employee', aliases: 'Youssef, Yousef, Youssif, Yousif, يوسف', active: true }

const H = 3600e3, M = 60e3;
function seedEmails() {
  const now = Date.now();
  return [
    { from: 'Lukas Weber <l.weber@frischmarkt.de>', to: 'ali@natura-eg.com', subject: 'Strawberry IQF – updated quotation for 3 containers', receivedAt: now - 25*M,
      body: 'Dear Ali,\n\nThank you for the samples, the team was happy with the colour and size grading. Could you please send us an updated quotation for 3 x 40ft reefer containers of IQF strawberries, CIF Hamburg? We need the offer by Wednesday to present it to our purchasing board.\n\nKind regards,\nLukas Weber' },
    { from: 'Priya Nair <priya@freshlinkasia.com>', to: 'info@natura-eg.com', subject: 'Shipping documents for PO 4471', receivedAt: now - 70*M,
      body: 'Dear Youssef,\n\nOur container for PO 4471 arrived in Singapore this morning but the phytosanitary certificate is missing from the document set. Kindly share a scanned copy urgently so customs clearance is not delayed. The original can follow by courier.\n\nThanks,\nPriya' },
    { from: 'Marco Bellini <marco.b@ortofresco.it>', to: 'mohamed.ali@natura-eg.com', subject: 'Jalapeño jars – label artwork approval', receivedAt: now - 150*M,
      body: 'Dear Mohamed,\n\nPlease find attached the final label artwork for the 720ml jalapeño jars. Can you review the Italian ingredient list and confirm approval before Friday? Printing is booked for next Monday.\n\nBest,\nMarco' },
    { from: 'Sophie Martin <s.martin@leclerc-import.fr>', to: 'shallaby@natura-eg.com', subject: 'Beetroot 2 KG – payment terms', receivedAt: now - 200*M,
      body: 'Dear Shallaby,\n\nFollowing our call, we would like to move from 60 to 45 days payment terms in exchange for a 1.5% price reduction on the beetroot 2 KG pouches. Please confirm whether this is acceptable so we can issue the new contract.\n\nRegards,\nSophie' },
    { from: 'Omar Al-Fahad <omar@gulffoods.ae>', to: 'export@natura-eg.com', subject: 'New season bell peppers – availability', receivedAt: now - 290*M,
      body: 'Dear Engy,\n\nWe are planning our winter programme and would like to know your weekly availability of red and yellow bell peppers from November to March, plus your best FOB Alexandria price. Please also advise on minimum order quantity.\n\nBest regards,\nOmar' },
    { from: 'Jan de Vries <jan@hollandverse.nl>', to: 'hamed@natura-eg.com', subject: 'Quality complaint – batch PT-0921 potatoes', receivedAt: now - 6.2*H,
      body: 'Dear Hamed,\n\nWe found greening on around 8% of the potatoes in batch PT-0921. Photos are attached. We need your investigation report and a proposal for compensation as soon as possible, ideally today, as our client is waiting.\n\nJan' },
    { from: 'Customs Broker <ops@alexclear.com.eg>', to: 'info@natura-eg.com', subject: 'Booking confirmation needed – vessel MSC Aurora', receivedAt: now - 8*H,
      body: 'Dear Ahmed,\n\nThe shipping line needs your final confirmation of the booking for vessel MSC Aurora (ETD Thursday). Kindly confirm the container count and VGM details before 4 pm tomorrow, otherwise the slot will be released.\n\nThank you,\nAlexClear Operations' },
    { from: 'Newsletter <news@agri-expo.com>', to: 'info@natura-eg.com', subject: 'Fruit Logistica 2027 – early bird stands', receivedAt: now - 26*H,
      body: 'Hello,\n\nEarly bird registration for exhibitor stands at Fruit Logistica 2027 is now open. Book before 30 November to get 15% off.\n\nThe Agri-Expo Team' },
    { from: 'Anna Kowalski <anna@polfresh.pl>', to: 'ali@natura-eg.com', subject: 'Re: Sample shipment received', receivedAt: now - 30*H, status: 'replied',
      body: 'Dear Ali,\n\nJust to let you know the samples arrived in perfect condition. We will come back with feedback next week.\n\nAnna' },
    { from: 'Daniel Brooks <dbrooks@us-produce.com>', to: 'youssef@natura-eg.com', subject: 'Certificates for audit', receivedAt: now - 3.5*H,
      body: 'Dear Youssef,\n\nOur annual supplier audit is next week. Could you send updated copies of your BRCGS and GlobalG.A.P. certificates? We also need the latest pesticide residue analysis for strawberries.\n\nThanks,\nDaniel' }
  ];
}

const DEMO_INCOMING = [
  { from: 'Elena Petrova <elena@balticfresh.lt>', to: 'info@natura-eg.com', subject: 'Urgent: revised ETA for container MSKU 77321',
    body: 'Dear Mohamed,\n\nOur warehouse needs the revised ETA for container MSKU 77321 today. Please send the updated tracking and confirm if the reefer temperature log is available.\n\nRegards,\nElena' },
  { from: 'Kenji Sato <kenji@tokyo-imports.jp>', to: 'info@natura-eg.com', subject: 'Price list request – canned beetroot',
    body: 'Dear Shallaby,\n\nCould you share your 2027 price list for canned beetroot A10 and A12 sizes, including pallet configuration? We plan to place a trial order in January.\n\nBest regards,\nKenji' },
  { from: 'Hans Müller <hans@edeka-partner.de>', to: 'ali@natura-eg.com', subject: 'Private label strawberry jam – specs',
    body: 'Dear Ali,\n\nPlease send the technical specification sheet and allergen statement for the private-label strawberry jam before our meeting on Tuesday.\n\nHans' },
  { from: 'Fatima Zahra <fz@maghrebtrade.ma>', to: 'info@natura-eg.com', subject: 'Partnership enquiry',
    body: 'Dear Ingy,\n\nWe are a distributor in Morocco interested in becoming a partner for your jalapeño and bell pepper range. Kindly let us know a suitable time for a video call next week.\n\nFatima' }
];

/* =====================================================================
   UTILITIES
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return 'sha256:' + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function parseAddress(raw) {
  const m = String(raw || '').match(/^\s*"?([^"<]*)"?\s*<([^>]+)>/);
  if (m) return { name: m[1].trim() || m[2].trim(), email: m[2].trim().toLowerCase() };
  return { name: String(raw || '').trim(), email: String(raw || '').trim().toLowerCase() };
}
function elapsed(ms) {
  if (ms < 0) ms = 0;
  const d = Math.floor(ms / 86400e3), h = Math.floor((ms % 86400e3) / H), m = Math.floor((ms % H) / M);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${m}m`;
}
function fmtTime(t) {
  const d = new Date(t), today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  return sameDay ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                 : d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function initials(name) { return String(name || '?').split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase(); }
function toast(msg, kind = 'ok') {
  const el = $('#toast');
  const bg = kind === 'err' ? 'bg-red-600' : 'bg-natura-900';
  el.innerHTML = `<div class="${bg} text-white px-5 py-3 rounded-xl shadow-lg font-medium flex items-center gap-2 fade-in"><i data-lucide="${kind === 'err' ? 'alert-circle' : 'check-circle-2'}" class="w-5 h-5"></i>${esc(msg)}</div>`;
  el.classList.remove('hidden'); icons();
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add('hidden'), 2600);
}
function icons() { if (window.lucide) lucide.createIcons(); }
const isDone = t => t.status !== 'pending';

/* =====================================================================
   EMAIL PARSING & ASSIGNMENT ENGINE
   Priority: (a) "To:" header = a registered personal email
             (b) greeting in body: "Dear Ali", "Hi Mahmoud", "عزيزي محمد" …
             (c) otherwise → Unassigned queue (admins assign manually)
   ===================================================================== */
const Engine = {
  aliasesOf(u) {
    const list = String(u.aliases || '').split(',').map(s => s.trim()).filter(Boolean);
    list.push(String(u.name || '').split(/\s+/)[0]);
    return [...new Set(list.map(a => a.toLowerCase()))];
  },
  greetingNames(body) {
    const text = String(body || '').slice(0, 600);
    const re = /(?:^|\n|\s)(?:dear|hi|hello|hey|good (?:morning|afternoon|evening)|attn:?|attention:?|عزيزي|عزيزتي|الأستاذ|الاستاذ|أستاذ|استاذ|المهندس|م\.)\s+(?:(?:mr|mrs|ms|miss|eng|dr|prof)\.?\s+)?([A-Za-z\u0621-\u064A\u0671-\u06D3]+)(?:\s*(?:,|and|&|و)\s*([A-Za-z\u0621-\u064A\u0671-\u06D3]+))?/gi;
    const names = []; let m;
    while ((m = re.exec(text))) { names.push(m[1]); if (m[2]) names.push(m[2]); }
    return names.map(n => n.toLowerCase());
  },
  assign(email, users) {
    const active = users.filter(u => u.active !== false);
    const toList = String(email.to || '').split(/[;,]/).map(a => parseAddress(a).email).filter(Boolean);
    const shared = CONFIG.SHARED_INBOXES.map(s => s.toLowerCase());
    for (const addr of toList) {
      if (shared.includes(addr)) continue;
      const u = active.find(x => String(x.email).toLowerCase() === addr);
      if (u) return { assignee: u.id, matchedBy: 'To: ' + addr };
    }
    for (const n of this.greetingNames(email.body)) {
      const u = active.find(x => this.aliasesOf(x).includes(n));
      if (u) return { assignee: u.id, matchedBy: `Greeting: "${n.charAt(0).toUpperCase() + n.slice(1)}"` };
    }
    return { assignee: null, matchedBy: 'No match' };
  }
};

/* =====================================================================
   ACTION BRIEF GENERATOR (in-browser fallback)
   In live mode the backend can supply an AI-written brief (Gemini);
   this extractive summariser is used whenever no brief is provided.
   ===================================================================== */
const Brief = {
  clean(body) {
    let lines = String(body || '').split('\n');
    const stop = lines.findIndex(l => /^\s*(>|-{2,}\s*original|on .+wrote:|from:\s|sent from my|kind regards|best regards|regards,|thanks,|thank you,|best,|cheers,|مع خالص|تحياتي)/i.test(l));
    if (stop > 0) lines = lines.slice(0, stop);
    return lines.filter(l => !/^\s*(dear|hi|hello|hey|عزيزي)\b/i.test(l)).join(' ').replace(/\s+/g, ' ').trim();
  },
  make(email) {
    const text = this.clean(email.body);
    const sentences = text.split(/(?<=[.!?؟])\s+(?=[A-Z\u0600-\u06FF"(])/);
    const ask = /\b(please|kindly|could you|can you|would you|need|needs|required|require|request|send|share|confirm|approve|review|advise|let us know|provide|update|urgent|asap|deadline|before|by (?:mon|tue|wed|thu|fri|sat|sun|tomorrow|today|end)|today|tomorrow)\b/i;
    const scored = sentences.map((s, i) => ({ s: s.trim(), i, score: (ask.test(s) ? 3 : 0) + (/\d/.test(s) ? 1 : 0) + (i === 0 ? 1 : 0) - (s.length > 260 ? 1 : 0) }))
                            .filter(x => x.s.length > 12);
    const top = [...scored].sort((a, b) => b.score - a.score).slice(0, 2).sort((a, b) => a.i - b.i).map(x => x.s);
    const sender = parseAddress(email.from).name.split(' ')[0] || 'Sender';
    let brief = top.length ? `${sender}: ${top.join(' ')}` : `${sender} sent an update. No explicit request detected.`;
    const due = text.match(/\b(today|tomorrow|(?:by|before|on)\s+(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday|\d{1,2}(?:st|nd|rd|th)?\s+\w+|\d{1,2}\s*(?:am|pm)|end of \w+))\b/i);
    if (due) brief += ` ⏱ Due: ${due[0]}.`;
    if (brief.length > 320) brief = brief.slice(0, 317) + '…';
    return brief;
  },
  urgent(email) { return /\b(urgent|asap|immediately|as soon as possible|today|complaint|claim|missing)\b|عاجل/i.test(email.subject + ' ' + email.body); },
  needsReply(email) { return !/\b(newsletter|no-?reply|unsubscribe|early bird)\b/i.test(email.from + ' ' + email.subject + ' ' + email.body); }
};

/* =====================================================================
   DATA LAYER — Demo (localStorage) or Live (Google Apps Script API)
   ===================================================================== */
const LIVE = !!CONFIG.API_URL;
const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const Local = {
  async ensureSeed() {
    if (LS.get('nat_users') && LS.get('nat_seed_v') === SEED_VERSION) return;
    const users = [];
    for (const u of SEED_USERS) users.push({ ...u, id: uid(), password: u.password.startsWith('sha256:') ? u.password : await sha256(u.password) });
    LS.set('nat_seed_v', SEED_VERSION); LS.set('nat_session', null); if (State) State.session = null;
    LS.set('nat_users', users);
    const tasks = seedEmails().map(e => this.buildTask(e, users));
    const by = u => users.find(x => x.username.toLowerCase() === u.toLowerCase());
    const due = new Date(); due.setDate(due.getDate() + 1); due.setHours(12, 0, 0, 0);
    tasks.unshift(this.buildManual({ title: 'Prepare jalapeño samples for Ortofresco',
      description: `@${by('mohamed ali').name} please prepare 3 jars of the 720ml jalapeño samples for Marco at Ortofresco and send me the courier tracking number.`,
      creator: by('Ingy'), assignee: by('mohamed ali').id, dueAt: due.toISOString(), createdAt: Date.now() - 50 * M }));
    tasks.unshift(this.buildManual({ title: 'Update the Q4 shipment tracker',
      description: `@${by('Ali').name} please add the three Frischmarkt containers to the Q4 shipment tracker once the quotation is accepted.`,
      creator: by('Shouieb'), assignee: by('Ali').id, createdAt: Date.now() - 3.2 * H }));
    LS.set('nat_tasks', tasks);
  },
  users() { return LS.get('nat_users', []); },
  tasks() { return LS.get('nat_tasks', []); },
  buildManual({ title, description, creator, assignee, dueAt = '', urgent = false, createdAt = Date.now() }) {
    const id = uid();
    return { id, messageId: 'manual-' + id, source: 'manual', from: '', fromName: creator.name, to: '', subject: title, body: description,
             receivedAt: new Date(createdAt).toISOString(), assignee, matchedBy: '@mention by ' + creator.name, status: 'pending',
             brief: description.slice(0, 320), urgent: !!urgent, createdBy: creator.id, createdByName: creator.name, dueAt: dueAt || '',
             updatedAt: new Date(createdAt).toISOString(), updatedBy: '' };
  },
  buildTask(e, users) {
    const a = Engine.assign(e, users);
    const fromP = parseAddress(e.from);
    const status = e.status || (Brief.needsReply(e) ? 'pending' : 'noreply');
    return { id: uid(), source: 'email', messageId: e.messageId || uid(), from: fromP.email, fromName: fromP.name, to: e.to, subject: e.subject, body: e.body,
             receivedAt: new Date(e.receivedAt || Date.now()).toISOString(), assignee: a.assignee, matchedBy: a.matchedBy,
             status, brief: e.brief || Brief.make(e), urgent: Brief.urgent(e),
             updatedAt: new Date(status !== 'pending' ? (e.receivedAt || Date.now()) : Date.now()).toISOString(), updatedBy: status !== 'pending' ? 'system' : '' };
  }
};

const Api = {
  async call(action, payload = {}) {
    const res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: State.session?.token, ...payload }) });
    const data = await res.json();
    if (!data.ok) { if (data.error === 'AUTH') { logout(true); } throw new Error(data.error || 'Request failed'); }
    return data;
  },
  async login(username, password) {
    if (LIVE) return (await this.call('login', { username, password }));
    await Local.ensureSeed();
    const u = Local.users().find(x => x.username.toLowerCase() === username.trim().toLowerCase());
    if (!u || u.password !== await sha256(password)) throw new Error('Incorrect username or password');
    if (u.active === false) throw new Error('This account is deactivated. Contact an admin.');
    const { password: _, ...safe } = u;
    return { ok: true, token: 'local', user: safe };
  },
  async sync() {
    if (LIVE) return this.call('sync');
    const me = State.session.user;
    const users = Local.users().map(({ password, ...u }) => u);
    const fresh = users.find(u => u.id === me.id);
    if (!fresh || fresh.active === false) { logout(true); throw new Error('AUTH'); }
    const all = Local.tasks();
    return { ok: true, users, tasks: me.role === 'admin' ? all : all.filter(t => t.assignee === me.id || t.createdBy === me.id) };
  },
  async setStatus(id, status) {
    if (LIVE) return this.call('setStatus', { id, status });
    const tasks = Local.tasks(); const t = tasks.find(x => x.id === id);
    if (t) { t.status = status; t.updatedAt = new Date().toISOString(); t.updatedBy = State.session.user.name; }
    LS.set('nat_tasks', tasks);
  },
  async createTasks(payload) {               // payload: { title, description, assignees: [userId], dueAt, urgent }
    if (LIVE) return this.call('createTask', payload);
    const me = State.session.user; const users = Local.users();
    const tasks = Local.tasks();
    payload.assignees.forEach(uid_ => {
      if (!users.some(u => u.id === uid_ && u.active !== false)) throw new Error('A mentioned member is not active');
      tasks.unshift(Local.buildManual({ ...payload, creator: me, assignee: uid_ }));
    });
    LS.set('nat_tasks', tasks);
  },
  async assign(id, userId) {
    if (LIVE) return this.call('assign', { id, userId });
    const tasks = Local.tasks(); const t = tasks.find(x => x.id === id);
    if (t) { t.assignee = userId || null; t.matchedBy = 'Assigned by ' + State.session.user.name; }
    LS.set('nat_tasks', tasks);
  },
  async upsertUser(user) {
    if (LIVE) return this.call('upsertUser', { user });
    const users = Local.users();
    const dupe = users.find(u => u.username.toLowerCase() === user.username.toLowerCase() && u.id !== user.id);
    if (dupe) throw new Error('Username already exists');
    const rec = { ...user };
    if (rec.password) rec.password = await sha256(rec.password); else delete rec.password;
    const i = users.findIndex(u => u.id === rec.id);
    if (i >= 0) users[i] = { ...users[i], ...rec }; else users.push({ active: true, ...rec, id: uid() });
    LS.set('nat_users', users);
  },
  async deleteUser(id) {
    if (LIVE) return this.call('deleteUser', { id });
    LS.set('nat_users', Local.users().filter(u => u.id !== id));
    const tasks = Local.tasks(); tasks.forEach(t => { if (t.assignee === id) { t.assignee = null; t.matchedBy = 'Owner removed'; } });
    LS.set('nat_tasks', tasks);
  },
  async importUsers(rows) {
    if (LIVE) return this.call('importUsers', { rows });
    for (const r of rows) {
      const existing = Local.users().find(u => u.username.toLowerCase() === r.username.toLowerCase());
      await this.upsertUser({ ...r, id: existing?.id });
    }
  },
  async ingestDemo(email) {
    const tasks = Local.tasks();
    tasks.unshift(Local.buildTask({ ...email, receivedAt: Date.now() }, Local.users()));
    LS.set('nat_tasks', tasks);
  }
};

const isAdmin = () => State.session?.user?.role === 'admin';

function slaOf(t, now = Date.now()) {
  if (isDone(t)) return 'done';
  if (t.dueAt) {                                   // manual task with a deadline: SLA follows the due time
    const left = new Date(t.dueAt).getTime() - now;
    if (left <= 0) return 'red';
    return left <= CONFIG.SLA_YELLOW_HOURS * H ? 'yellow' : 'green';
  }
  const hrs = (now - new Date(t.receivedAt).getTime()) / H;
  if (hrs >= CONFIG.SLA_RED_HOURS) return 'red';
  if (hrs >= CONFIG.SLA_YELLOW_HOURS) return 'yellow';
  return 'green';
}
function myTasks() { return State.tasks.filter(t => t.assignee === State.session.user.id); }
function sentTasks() { const me = State.session.user.id; return State.tasks.filter(t => t.createdBy === me && t.assignee !== me); }
const isManual = t => t.source === 'manual';

/* =====================================================================
   SYNC + ALERTS
   ===================================================================== */
async function sync(silent = true) {
  try {
    const data = await Api.sync();
    const prevIds = State.knownIds;
    State.users = data.users || State.users;
    State.tasks = (data.tasks || []).sort((a, b) => new Date(b.receivedAt) - new Date(a.receivedAt));
    State.lastSync = Date.now(); State.syncOk = true;
    const relevant = isAdmin() ? State.tasks : myTasks();
    if (prevIds) {
      const fresh = relevant.filter(t => !prevIds.has(t.id) && t.status === 'pending');
      if (fresh.length) notify(`${fresh.length} new task${fresh.length > 1 ? 's' : ''}`, fresh.map(t => isManual(t) ? `@${t.createdByName} assigned you: ${t.subject}` : `${t.fromName}: ${t.subject}`).join('\n'), 'new');
    }
    State.knownIds = new Set(relevant.map(t => t.id));
    const s = State.session.user; const me = State.users.find(u => u.id === s.id);
    if (me && (me.role !== s.role || me.name !== s.name)) { State.session.user = { ...s, role: me.role, name: me.name, email: me.email }; LS.set('nat_session', State.session); }
    render();
    checkOverdueAlerts();
  } catch (e) {
    State.syncOk = false; updateSyncBadge();
    if (!silent && e.message !== 'AUTH') toast('Sync failed: ' + e.message, 'err');
  }
}
let pollTimer, tickTimer;
function startLoops() {
  clearInterval(pollTimer); clearInterval(tickTimer);
  pollTimer = setInterval(() => { if (document.visibilityState === 'visible' || LIVE) sync(); }, CONFIG.POLL_SECONDS * 1000);
  tickTimer = setInterval(() => { updateTimers(); updateSyncBadge(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
  window.addEventListener('storage', e => { if (e.key === 'nat_tasks' || e.key === 'nat_users') sync(); }); // instant cross-tab sync in demo mode
}
function updateTimers() {
  const now = Date.now();
  document.querySelectorAll('[data-received]').forEach(el => {
    const t = State.tasks.find(x => x.id === el.dataset.id); if (!t) return;
    const sla = slaOf(t, now);
    el.dataset.sla = sla;
    const pill = el.querySelector('.sla-pill');
    if (pill) { pill.dataset.sla = sla; pill.querySelector('span').textContent = slaLabel(t, now); }
  });
  checkOverdueAlerts();
}
function slaLabel(t, now = Date.now()) {
  if (t.status === 'replied') return 'Replied';
  if (t.status === 'completed') return 'Completed';
  if (t.status === 'noreply') return isManual(t) ? 'Not needed' : 'No reply needed';
  if (t.dueAt) {
    const left = new Date(t.dueAt).getTime() - now;
    return left <= 0 ? `Overdue · ${elapsed(-left)}` : `Due in ${elapsed(left)}`;
  }
  const e = elapsed(now - new Date(t.receivedAt).getTime());
  const s = slaOf(t, now);
  return s === 'red' ? `Overdue · ${e}` : isManual(t) ? `Open ${e}` : `Waiting ${e}`;
}

let audioCtx;
function beep(kind = 'alert') {
  if (!State.soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'new' ? [660, 880] : [880, 660, 880];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
      const t0 = audioCtx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      o.start(t0); o.stop(t0 + 0.17);
    });
  } catch {}
}
async function notify(title, body, kind = 'alert') {
  beep(kind);
  if (!State.alertsOn || !('Notification' in window) || Notification.permission !== 'granted') { toast(title); return; }
  const opts = { body, icon: window.__iconPng || CONFIG.LOGO_URL, badge: window.__iconPng, tag: 'natura-' + kind, renotify: true };
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) reg.showNotification(title, opts); else new Notification(title, opts);
  } catch { toast(title); }
}
function checkOverdueAlerts() {
  if (!State.session) return;
  const key = 'nat_alerted_' + State.session.user.id;
  const log = LS.get(key, {}); const now = Date.now(); const due = [];
  const scope = isAdmin() ? State.tasks : myTasks();
  scope.filter(t => slaOf(t, now) === 'red').forEach(t => {
    if (!log[t.id] || now - log[t.id] > CONFIG.REMIND_EVERY_MIN * M) { due.push(t); log[t.id] = now; }
  });
  LS.set(key, log);
  if (due.length) notify(`⚠ ${due.length} overdue email${due.length > 1 ? 's' : ''} (>${CONFIG.SLA_RED_HOURS}h)`, due.slice(0, 4).map(t => `${t.fromName}: ${t.subject}`).join('\n'));
}
async function toggleAlerts() {
  if (!State.alertsOn) {
    if (!('Notification' in window)) { toast('This browser does not support notifications', 'err'); return; }
    const p = await Notification.requestPermission();
    if (p !== 'granted') { toast('Notifications blocked in browser settings', 'err'); return; }
    State.alertsOn = true; beep('new'); toast('Alerts enabled');
  } else { State.alertsOn = false; toast('Alerts paused'); }
  LS.set('nat_alerts', State.alertsOn); render();
}

    case 'all': return isAdmin() ? viewAll() : viewMine();

}
function bindView() {
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { State.filter = b.dataset.filter; render(); });
  const sb = $('#searchBox'); if (sb) sb.oninput = e => { State.search = e.target.value; render(); };
  const ef = $('#empFilter'); if (ef) ef.onchange = e => { State.empFilter = e.target.value; render(); };
  const sf = $('#slaFilter'); if (sf) sf.onchange = e => { State.slaFilter = e.target.value; render(); };
  document.querySelectorAll('[data-status]').forEach(b => b.onclick = async () => {
    const id = b.closest('[data-id]').dataset.id, status = b.dataset.status;
    const t = State.tasks.find(x => x.id === id); const prev = t.status;
    t.status = status; t.updatedBy = State.session.user.name; render();       // optimistic
    try { await Api.setStatus(id, status); toast(status === 'pending' ? 'Task reopened' : 'Marked as ' + statusName(status, t)); sync(); }
    catch (e) { t.status = prev; render(); toast(e.message, 'err'); }
  });
  document.querySelectorAll('[data-reply]').forEach(b => b.onclick = () => openReply(b.closest('[data-id]').dataset.id, b.dataset.reply));
  document.querySelectorAll('[data-expand]').forEach(b => b.onclick = () => {
    const body = b.closest('[data-id]').querySelector('.full-body'); body.classList.toggle('hidden');
    b.querySelector('span').textContent = body.classList.contains('hidden') ? 'Show full email' : 'Hide email';
  });
  document.querySelectorAll('[data-assign]').forEach(s => s.onchange = async () => {
    try { await Api.assign(s.dataset.assign, s.value); toast(s.value ? 'Task assigned to ' + userById(s.value)?.name : 'Task unassigned'); sync(); }
    catch (e) { toast(e.message, 'err'); }
  });
  document.querySelectorAll('[data-open-emp]').forEach(r => r.onclick = () => { State.view = 'all'; State.empFilter = r.dataset.openEmp; State.filter = 'todo'; render(); });
  const sim = $('#simulateBtn'); if (sim) sim.onclick = async () => {
    const e = DEMO_INCOMING[Math.floor(Math.random() * DEMO_INCOMING.length)];

  };
  bindTeam();
}
const statusName = (s, t) => (t && isManual(t) ? { pending: 'Open', completed: 'Done', noreply: 'Not needed', replied: 'Replied' }
                                              : { pending: 'Pending reply', replied: 'Replied', completed: 'Completed', noreply: 'No reply needed' })[s] || s;

function filterTasks(list) {
  const q = State.search.trim().toLowerCase();
  return list.filter(t => {
    if ((State.filter === 'todo' || State.filter === 'sent') && isDone(t)) return false;
    if (State.filter === 'done' && !isDone(t)) return false;
    if (State.filter === 'overdue' && slaOf(t) !== 'red') return false;
    if (q && !(t.subject + ' ' + t.fromName + ' ' + t.from + ' ' + t.brief + ' ' + t.body + ' ' + (t.createdByName || '') + ' ' + (userById(t.assignee)?.name || '')).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => {
    const order = { red: 0, yellow: 1, green: 2, done: 3 };
    const d = order[slaOf(a)] - order[slaOf(b)];
    return d || (isDone(a) ? new Date(b.receivedAt) - new Date(a.receivedAt) : new Date(a.receivedAt) - new Date(b.receivedAt));
  });
}

  const unassigned = open.filter(t => !t.assignee);

  const doneToday = all.filter(t => isDone(t) && new Date(t.updatedAt).toDateString() === today).length;
  const team = State.users.filter(u => u.active !== false).map(u => {
    const mine = all.filter(t => t.assignee === u.id), o = mine.filter(t => !isDone(t));
    const oldest = o.reduce((m, t) => Math.min(m, new Date(t.receivedAt).getTime()), Infinity);
    return { u, open: o.length, red: o.filter(t => slaOf(t, now) === 'red').length, yellow: o.filter(t => slaOf(t, now) === 'yellow').length,

    <section class="lg:col-span-3 bg-white rounded-2xl shadow-sm p-5">
      <div class="flex items-center justify-between mb-4"><h2 class="font-display font-bold text-lg">Workload by team member</h2><span class="text-xs text-gray-500">Click a row to see tasks</span></div>
      <div class="overflow-x-auto scroll-thin">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-gray-500 text-xs uppercase tracking-wide"><th class="pb-2 font-semibold">Member</th><th class="pb-2 font-semibold">Open load</th><th class="pb-2 font-semibold text-center">🔴</th><th class="pb-2 font-semibold text-center">🟡</th><th class="pb-2 font-semibold text-center">🟢</th><th class="pb-2 font-semibold text-center">Done today</th><th class="pb-2 font-semibold">Oldest waiting</th></tr></thead>
        <tbody>
        ${team.map(x => `<tr data-open-emp="${x.u.id}" class="border-t border-gray-100 hover:bg-natura-cream/60 cursor-pointer">
          <td class="py-3 pr-3"><div class="flex items-center gap-2"><span class="w-8 h-8 rounded-full bg-natura-sand text-natura-700 text-xs font-bold flex items-center justify-center">${esc(initials(x.u.name))}</span><div><div class="font-semibold">${esc(x.u.name)}</div><div class="text-xs text-gray-500">${x.u.role === 'admin' ? 'Admin' : 'Team'}</div></div></div></td>
          <td class="py-3 pr-3 min-w-[140px]"><div class="flex items-center gap-2"><div class="h-2.5 flex-1 rounded-full bg-gray-100 overflow-hidden flex">
            <div style="width:${x.red / maxOpen * 100}%" class="bg-red-500"></div><div style="width:${x.yellow / maxOpen * 100}%" class="bg-amber-400"></div><div style="width:${x.green / maxOpen * 100}%" class="bg-emerald-500"></div></div><b>${x.open}</b></div></td>
          <td class="py-3 text-center font-semibold ${x.red ? 'text-red-600' : 'text-gray-300'}">${x.red}</td>
          <td class="py-3 text-center font-semibold ${x.yellow ? 'text-amber-600' : 'text-gray-300'}">${x.yellow}</td>
          <td class="py-3 text-center font-semibold ${x.green ? 'text-emerald-600' : 'text-gray-300'}">${x.green}</td>
          <td class="py-3 text-center">${x.done}</td>
          <td class="py-3 ${x.oldest > CONFIG.SLA_RED_HOURS * H ? 'text-red-600 font-semibold' : 'text-gray-600'}">${x.oldest != null ? elapsed(x.oldest) : '—'}</td></tr>`).join('')}

      <h2 class="font-display font-bold text-lg mb-4 flex items-center gap-2"><i data-lucide="siren" class="w-5 h-5 text-red-600"></i>Overdue & unreplied</h2>
      ${red.length ? `<ul class="space-y-2">${red.sort((a, b) => new Date(a.receivedAt) - new Date(b.receivedAt)).slice(0, 8).map(t => `
        <li class="task-card rounded-xl bg-red-50/50 p-3" data-id="${t.id}" data-received="${esc(t.receivedAt)}" data-sla="red">
          <div class="flex items-center justify-between gap-2"><span class="font-semibold text-sm truncate">${esc(t.subject)}</span>

    <div class="grid gap-4 lg:grid-cols-2">${unassigned.map(t => taskCard(t, { showOwner: true })).join('')}</div>
  </section>` : ''}`;
}

/* ---- Admin: all tasks ---- */

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function importUsersFile(file) {
  try {
    if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
    const pick = (r, ...keys) => { for (const k of Object.keys(r)) if (keys.includes(k.trim().toLowerCase())) return String(r[k]).trim(); return ''; };
    // Only columns that exist in the sheet are applied, so a Username+Password-only sheet
    // updates passwords without touching anyone's role, email or aliases.
    const cols = new Set(Object.keys(raw[0] || {}).map(k => k.trim().toLowerCase()));
    const has = (...k) => k.some(x => cols.has(x));
    const rows = raw.map(r => {
      const o = { username: pick(r, 'username', 'user', 'login') };
      if (has('name', 'full name') && pick(r, 'name', 'full name')) o.name = pick(r, 'name', 'full name');
      if (pick(r, 'password', 'pass')) o.password = pick(r, 'password', 'pass');
      if (has('email', 'e-mail', 'mail')) o.email = pick(r, 'email', 'e-mail', 'mail').toLowerCase();
      if (has('role')) o.role = /admin/i.test(pick(r, 'role')) ? 'admin' : 'employee';
      if (has('aliases', 'alias', 'nicknames')) o.aliases = pick(r, 'aliases', 'alias', 'nicknames');
      if (has('active', 'status')) o.active = !/^(false|no|0|inactive)$/i.test(pick(r, 'active', 'status') || 'true');
      if (!State.users.some(u => u.username.toLowerCase() === o.username.toLowerCase())) {   // brand-new user: sensible defaults
        o.name = o.name || o.username.replace(/\b\w/g, c => c.toUpperCase());
        o.role = o.role || 'employee'; o.email = o.email || ''; o.active = o.active ?? true;
      }
      return o;
    }).filter(r => r.username);
    if (!rows.length) return toast('No valid rows found — check the column names', 'err');
    const newcomers = rows.filter(r => !State.users.some(u => u.username.toLowerCase() === r.username.toLowerCase()) && !r.password);
    if (newcomers.length) return toast(`Missing password for new user(s): ${newcomers.map(r => r.username).join(', ')}`, 'err');
    if (!confirm(`Import ${rows.length} user(s) from "${file.name}"?`)) return;
    await Api.importUsers(rows); toast(`${rows.length} user(s) imported`); sync();
  } catch (e) { toast('Import failed: ' + (e?.message || 'could not load the Excel reader — check your internet connection'), 'err'); }
  finally { const i = $('#importFile'); if (i) i.value = ''; }
}

/* =====================================================================
   @MENTION MANUAL TASKS
   Type "@" in the description → team list pops up at the cursor,
   filters as you type, ↑/↓ + Enter/Tab (or tap) to pick.
   Every @mentioned person gets the task in their own queue.
   ===================================================================== */
const Mention = {
  activeUsers() { return State.users.filter(u => u.active !== false); },
  candidates(q) {
    q = q.toLowerCase();
    const load = id => State.tasks.filter(t => t.assignee === id && !isDone(t)).length;
    return this.activeUsers()
      .map(u => {
        const name = u.name.toLowerCase(), first = name.split(' ')[0];
        const aliases = String(u.aliases || '').toLowerCase();
        let rank = !q ? 2 : first.startsWith(q) ? 0 : name.split(' ').some(p => p.startsWith(q)) || u.username.toLowerCase().startsWith(q) ? 1
                 : name.includes(q) || aliases.includes(q) ? 2 : -1;
        return { u, rank, load: load(u.id) };
      })
      .filter(x => x.rank >= 0)
      .sort((a, b) => a.rank - b.rank || a.u.name.localeCompare(b.u.name))
      .slice(0, 8);
  },
  // Which users are tagged in the text? Works for picked names and hand-typed @username.
  parse(text) {
    let work = ' ' + String(text || '');
    const found = [];
    const reEsc = v => v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const tokens = this.activeUsers().flatMap(u => [{ u, key: u.name }, { u, key: u.username }])
                                     .sort((a, b) => b.key.length - a.key.length);
    for (const { u, key } of tokens) {
      const re = new RegExp('@' + reEsc(key) + '(?![\\p{L}\\p{N}._-])', 'giu');
      if (re.test(work)) { if (!found.includes(u)) found.push(u); work = work.replace(re, ' '); }
    }
    return found;
  },
  strip(text) {   // text with every @mention removed (used to auto-title a task)
    let out = String(text || '');
    const reEsc = v => v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    this.activeUsers().flatMap(u => [u.name, u.username]).sort((a, b) => b.length - a.length)
      .forEach(k => { out = out.replace(new RegExp('@' + reEsc(k) + '(?![\\p{L}\\p{N}._-])', 'giu'), ' \u0001 '); });
    out = out.replace(/\u0001(\s*(?:,|and|&|و)\s*\u0001)+/g, '\u0001').replace(/\u0001/g, ' ').replace(/\s+/g, ' ').trim();
    let prev;   // drop filler left at the start: "Please ask … to send" → "send"
    do { prev = out; out = out.replace(/^(?:please|kindly|pls|can you|could you|would you|ask|tell|remind|to|,|:|-)\s*/i, ''); } while (out !== prev);
    return out;
  }
};
function renderMentions(text) {
  let html = esc(text);
  const names = State.users.flatMap(u => [u.name, u.username]).filter(Boolean).sort((a, b) => b.length - a.length);
  const reEsc = v => esc(v).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  if (!names.length) return html;
  const re = new RegExp('@(' + names.map(reEsc).join('|') + ')(?![\\p{L}\\p{N}._-])', 'giu');
  return html.replace(re, m => `<span class="mention">${m}</span>`);
}
// Pixel position of the caret inside a textarea (mirror-div technique)
function caretXY(ta, pos) {
  const cs = getComputedStyle(ta), div = document.createElement('div');
  ['boxSizing', 'width', 'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth', 'paddingTop', 'paddingRight',
   'paddingBottom', 'paddingLeft', 'fontStyle', 'fontVariant', 'fontWeight', 'fontSize', 'lineHeight', 'fontFamily', 'textAlign',
   'textTransform', 'textIndent', 'letterSpacing', 'wordSpacing', 'tabSize', 'direction'].forEach(p => div.style[p] = cs[p]);
  Object.assign(div.style, { position: 'absolute', visibility: 'hidden', whiteSpace: 'pre-wrap', overflowWrap: 'break-word', top: '0', left: '-9999px' });
  div.textContent = ta.value.slice(0, pos);
  const span = document.createElement('span'); span.textContent = ta.value.slice(pos) || '.'; div.appendChild(span);
  document.body.appendChild(div);
  const lh = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.5;
  const r = { top: span.offsetTop - ta.scrollTop, left: span.offsetLeft - ta.scrollLeft, lh };
  div.remove(); return r;
}

      ? `<div class="px-3 pt-2.5 pb-1 text-[11px] font-bold uppercase tracking-wide text-gray-400">Assign to</div>` +
        st.items.map((x, i) => `
        <div id="mopt-${i}" role="option" aria-selected="${i === st.idx}" data-pick="${i}" class="mention-item flex items-center gap-3 px-3 py-2.5 cursor-pointer">
          <span class="w-9 h-9 rounded-full ${x.u.role === 'admin' ? 'bg-natura-700 text-white' : 'bg-natura-sand text-natura-700'} text-xs font-bold flex items-center justify-center shrink-0">${esc(initials(x.u.name))}</span>
          <span class="min-w-0 flex-1 leading-tight"><b class="block truncate text-sm">${esc(x.u.name)}${x.u.id === me.id ? ' <span class="font-normal text-gray-400">(you)</span>' : ''}</b>
            <span class="block truncate text-xs text-gray-500">@${esc(x.u.username)}${isAdmin() ? ` · ${x.load} open` : x.u.role === 'admin' ? ' · Admin' : ''}</span></span>
          <span class="mention-enter opacity-0 text-[10px] font-bold text-gray-400 border border-gray-200 rounded px-1.5 py-0.5">↵</span>
        </div>`).join('')
      : `<div class="px-4 py-4 text-sm text-gray-500 flex items-center gap-2"><i data-lucide="user-x" class="w-4 h-4"></i>No matching team member</div>`;
    icons();
    menu.querySelectorAll('[data-pick]').forEach(el => {
      el.onpointerdown = e => { e.preventDefault(); pick(+el.dataset.pick); };   // keep focus in textarea
      el.onmouseenter = () => { st.idx = +el.dataset.pick; menu.querySelectorAll('[data-pick]').forEach((n, i) => n.setAttribute('aria-selected', i === st.idx)); };
    });
    ta.setAttribute('aria-activedescendant', st.items.length ? 'mopt-' + st.idx : '');
  }
  function placeMenu() {
    menu.classList.remove('hidden'); menu.classList.remove('pop-in'); void menu.offsetWidth; menu.classList.add('pop-in');
    const c = caretXY(ta, st.start);
    const narrow = wrap.clientWidth < 420;
    const w = narrow ? wrap.clientWidth : Math.min(288, wrap.clientWidth);
    menu.style.width = w + 'px';
    const left = narrow ? 0 : Math.max(0, Math.min(ta.offsetLeft + c.left - 12, wrap.clientWidth - w));
    let top = ta.offsetTop + Math.min(c.top, ta.clientHeight - c.lh) + c.lh + 6;
    menu.style.left = left + 'px'; menu.style.top = top + 'px';
  }
  function updateMention() {
    const pos = ta.selectionStart;
    if (pos !== ta.selectionEnd) return hideMenu();
    const m = ta.value.slice(0, pos).match(/(?:^|[\s(,])@([^\s@]{0,30})$/u);
    if (!m) return hideMenu();
    st.start = pos - m[1].length - 1;
    const items = Mention.candidates(m[1]);
    if (!st.open || items.map(x => x.u.id).join() !== st.items.map(x => x.u.id).join()) st.idx = 0;
    st.items = items; st.open = true; ta.setAttribute('aria-expanded', 'true');
    drawMenu(); placeMenu();
  }
  function pick(i) {
    const x = st.items[i]; if (!x) return;
    const before = ta.value.slice(0, st.start), after = ta.value.slice(ta.selectionStart).replace(/^[^\s@]*/, '');
    const insert = '@' + x.u.name + ' ';
    ta.value = before + insert + after.replace(/^\s/, '');
    const caret = (before + insert).length;
    ta.focus(); ta.setSelectionRange(caret, caret);
    hideMenu(); refresh();
  }
  function refresh() {
    const users = Mention.parse(ta.value);
    const btn = $('#createBtn');
    btn.disabled = !users.length || ta.value.trim().length < 3;
    btn.querySelector('span').textContent = users.length > 1 ? `Create ${users.length} tasks` : 'Create task';
    $('#assigneePreview').innerHTML = users.length
      ? `<span class="text-gray-500">Goes to</span>` + users.map(u => `<span class="flex items-center gap-1.5 bg-natura-cream border border-natura-sand rounded-full pl-1 pr-3 py-0.5 fade-in"><span class="w-6 h-6 rounded-full bg-natura-700 text-white text-[10px] font-bold flex items-center justify-center">${esc(initials(u.name))}</span><b>${esc(u.name)}</b></span>`).join('')
        + (users.length > 1 ? `<span class="text-xs text-gray-500">— each gets their own copy</span>` : '')
      : `<span class="text-gray-400 flex items-center gap-1.5"><i data-lucide="info" class="w-4 h-4"></i>Mention at least one person with @ to assign this task</span>`;
    icons();
  }

  ta.addEventListener('input', () => { updateMention(); refresh(); });
  ta.addEventListener('click', updateMention);
  ta.addEventListener('keyup', e => { if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) updateMention(); });
  ta.addEventListener('scroll', () => st.open && placeMenu());
  ta.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== ta) hideMenu(); }, 150));
  ta.addEventListener('keydown', e => {
    if (!st.open) { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') $('#taskForm').requestSubmit(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!st.items.length) return;
      st.idx = (st.idx + (e.key === 'ArrowDown' ? 1 : -1) + st.items.length) % st.items.length; drawMenu();
      menu.querySelector(`#mopt-${st.idx}`)?.scrollIntoView({ block: 'nearest' });
    } else if ((e.key === 'Enter' || e.key === 'Tab') && st.items.length) { e.preventDefault(); pick(st.idx); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); hideMenu(); }
  });
  $('#atBtn').onpointerdown = e => e.preventDefault();   // keep the keyboard open on phones
  $('#atBtn').onclick = () => {
    const pos = ta.selectionStart ?? ta.value.length, before = ta.value.slice(0, pos);
    const ins = (before && !/\s$/.test(before) ? ' ' : '') + '@';
    ta.value = before + ins + ta.value.slice(pos);
    ta.focus(); ta.setSelectionRange(pos + ins.length, pos + ins.length); updateMention(); refresh();
  };
  document.querySelectorAll('#modal-root [data-due]').forEach(b => b.onclick = () => {
    const d = new Date();
    if (b.dataset.due === '2h') d.setHours(d.getHours() + 2);
    if (b.dataset.due === 'eod') { d.setHours(17, 0, 0, 0); if (d < new Date()) d.setDate(d.getDate() + 1); }
    if (b.dataset.due === 'tom') { d.setDate(d.getDate() + 1); d.setHours(12, 0, 0, 0); }
    $('#taskForm [name=dueAt]').value = toLocalInput(d);
  });

  $('#taskForm').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const description = ta.value.trim();
    const users = Mention.parse(description);
    if (!users.length) { toast('Type @ and pick who should do this', 'err'); ta.focus(); return; }
    let title = String(f.get('title') || '').trim();
    if (!title) {
      title = Mention.strip(description);
      title = (title.charAt(0).toUpperCase() + title.slice(1)).slice(0, 70) + (title.length > 70 ? '…' : '');
      if (!title) title = 'Task from ' + me.name;
    }
    const dueRaw = f.get('dueAt');
    const payload = { title, description, assignees: users.map(u => u.id), dueAt: dueRaw ? new Date(dueRaw).toISOString() : '', urgent: !!f.get('urgent') };
    const btn = $('#createBtn'); btn.disabled = true; btn.querySelector('span').textContent = 'Creating…';
    try {
      await Api.createTasks(payload);
      document.removeEventListener('keydown', escClose);
      $('#modal-root').innerHTML = '';
      toast(users.length > 1 ? `${users.length} tasks created` : (users[0].id === me.id ? 'Task added to your list' : `Task assigned to ${users[0].name}`));
      if (!users.some(u => u.id === me.id) && State.view === 'mine') State.filter = 'sent';
      await sync();
    } catch (err) { toast(err.message, 'err'); refresh(); }
  };

  refresh();
  if (prefillUser) { ta.value = '@' + prefillUser.name + ' '; refresh(); }
  setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 60);
}

/* ---- Reply helpers ---- */
function openReply(id, mode) {
  const t = State.tasks.find(x => x.id === id); if (!t) return;
  if (mode === 'webmail') { window.open(CONFIG.WEBMAIL === 'outlook' ? CONFIG.OUTLOOK_URL : CONFIG.ZOHO_URL, '_blank', 'noopener'); return; }
  const me = State.session.user;
  const first = (t.fromName || '').split(' ')[0];
  const subject = /^re:/i.test(t.subject) ? t.subject : 'Re: ' + t.subject;
  const body = `Dear ${first},\n\nThank you for your email regarding "${t.subject}".\n\n\n\nBest regards,\n${me.name}\n${CONFIG.COMPANY}\n\n----- Original message -----\nFrom: ${t.fromName} <${t.from}>\nSent: ${new Date(t.receivedAt).toLocaleString()}\n\n${t.body}`;
  if (CONFIG.WEBMAIL === 'outlook') {
    window.open(`https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(t.from)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`, '_blank', 'noopener');
  } else {
    location.href = `mailto:${encodeURIComponent(t.from)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body.slice(0, 1800))}`;
  }
  setTimeout(() => toast('After sending, tap "Replied" to close the task'), 600);
}

/* =====================================================================
   PWA: manifest (generated in-page) + service worker (sw.js)
   ===================================================================== */
async function setupPWA() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#1F5130"/><g transform="translate(96 96) scale(13.3)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></g><circle cx="392" cy="120" r="48" fill="#E9A23B"/></svg>`;
  const svgUrl = 'data:image/svg+xml;base64,' + btoa(svg);
  const png = size => new Promise(res => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = size; c.getContext('2d').drawImage(img, 0, 0, size, size); res(c.toDataURL('image/png')); }; img.onerror = () => res(svgUrl); img.src = svgUrl; });
  const [p192, p512] = await Promise.all([png(192), png(512)]);
  window.__iconPng = p192;
  const base = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
  const manifest = {
    name: CONFIG.APP_NAME, short_name: 'Natura Tasks', description: 'Email-driven task tracking for Natura Agro-Trade',
    start_url: base, scope: base, display: 'standalone', orientation: 'any', background_color: '#F6F4EC', theme_color: '#1F5130',
    icons: [{ src: p192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' }, { src: p512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }]
  };
  const link = document.createElement('link'); link.rel = 'manifest';
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
  document.head.appendChild(link);
  const apple = document.createElement('link'); apple.rel = 'apple-touch-icon'; apple.href = p192; document.head.appendChild(apple);
  const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = svgUrl; document.head.appendChild(fav);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installPrompt = e; if (State.session) render(); });
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  if (!State.session) return renderLogin();
  if (!State.view) State.view = isAdmin() ? 'overview' : 'mine';
  $('#root').innerHTML = `<div class="min-h-screen flex items-center justify-center"><div class="flex items-center gap-3 text-natura-700 font-semibold"><i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i>Loading your tasks…</div></div>`; icons();
  await sync(false);
  startLoops();
}
setupPWA();
(LIVE ? Promise.resolve() : Local.ensureSeed()).then(boot);
</script>
